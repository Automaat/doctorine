name: Dependency Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          experimental: true
        env:
          MISE_PYTHON_COMPILE: '0'

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Report outdated npm packages
        run: npm outdated >> "$GITHUB_STEP_SUMMARY" || true

      - name: Report outdated Go modules
        working-directory: backend-go
        run: go list -m -u all >> "$GITHUB_STEP_SUMMARY" || true

      - name: Install govulncheck
        continue-on-error: true
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan Go modules
        continue-on-error: true
        working-directory: backend-go
        run: govulncheck ./... >> "$GITHUB_STEP_SUMMARY" || true
